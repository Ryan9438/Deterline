name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # 03 手册 2.5：无游戏资产的单元测试 + 文档生成检查 + 帮助/安装入口
    # 三平台矩阵——Windows 实测 msvcrt 锁分支与路径语义，macOS 实测 BSD 侧
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # golden 由 3.14 生成（argparse 换行行为随解释器版本变化）
          python-version: "3.14"
      - name: 字体渲染测试依赖
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: UTMT CLI 占位
        shell: bash
        run: |
          echo "UTMT_CLI=$RUNNER_TEMP/deterline-utmt-placeholder.dll" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/deterline-utmt-placeholder.dll"
      - name: 全量单测（无游戏资产）
        run: python3 -m unittest discover -s tests -v
      - name: 文档生成检查
        run: python3 tools/gen_docs.py --check
      - name: 安装入口自检（只读 --check；fresh runner 无 .NET/UTMT，rc=1 属预期）
        shell: bash
        run: |
          RC=0
          python3 install.py --check || RC=$?
          echo "install --check rc=$RC（入口可运行即达标，03 §2.5）"
      - name: diff 卫生
        shell: bash
        run: git diff --check && git diff --cached --check
